# UI-Items — custom items (crafting, item tools, particle accelerator, scanner).

# ==================================================================
# ITEMS / PARTICLES
# ==================================================================

# Concrete bucket: poured water turns into concrete after the delay.
[concrete_bucket]
# Master switch (true = a concrete bucket pours cement instead of plain water).
# Default: true
enabled = true
# Seconds the cement stays liquid before it hardens.
# Default: 60
harden_delay_seconds = 60
# Block the liquid cement turns into (Bukkit Material name).
# Default: GRAY_CONCRETE
harden_block = "GRAY_CONCRETE"
# Biome used to tint the liquid gray (Bukkit Biome name).
# Default: PALE_GARDEN
tint_biome = "PALE_GARDEN"
# Hint particle on every still-liquid block (Bukkit Particle name).
# Default: CRIT
particle = "CRIT"
# Particles per block per hint pass.
# Default: 1
particle_count = 1
# Random spread radius of the particles around the block centre.
# Default: 0.25
particle_offset = 0.25
# Hint particle interval in ticks (10 = twice per second).
# Default: 10
particle_interval_ticks = 10
# Dull sound when a bucket / bottle / dispenser tries to take the liquid cement.
# Bukkit Sound name. Empty = silent.
# Default: BLOCK_MUD_HIT
blocked_sound = "BLOCK_MUD_HIT"
# Pitch of that sound (0.5 do 2.0, ниже = глуше).
# Default: 0.6
blocked_sound_pitch = 0.6

# Custom netherite upgrade recipe.
[netherite_upgrade]

# base values section.
[netherite_upgrade.base_values]
# Speed.
# Default: 1
block_break_speed = 1

# armor section.
[netherite_upgrade.base_values.armor]
# Default: 3
helmet = 3
# Default: 8
chestplate = 8
# Default: 6
leggings = 6
# Default: 3
boots = 3

# weapons section.
[netherite_upgrade.base_values.weapons]
# Default: 8
sword = 8
# Default: 5
mace = 5

# Particle accelerator machine.
[particle_accelerator]
# Master switch (true = feature on).
# Default: true
enabled = true
# Default: [{ material_a = "GOLD_INGOT", material_b = "DIAMOND", speed_min_pct = 5.0, speed_max_pct = 10.0, result = "EMERALD" }, { material_a = "DIAMOND", material_b = "EMERALD", speed_min_pct = 10.0, speed_max_pct = 15.0, result = "NETHERITE_SCRAP" }]
collision_recipes = [{ material_a = "GOLD_INGOT", material_b = "DIAMOND", speed_min_pct = 5.0, speed_max_pct = 10.0, result = "EMERALD" }, { material_a = "DIAMOND", material_b = "EMERALD", speed_min_pct = 10.0, speed_max_pct = 15.0, result = "NETHERITE_SCRAP" }]

# Remote Detonator — binds one TNT block and detonates it from afar.
# Detonation: RMB in the air only (RMB on a block shows the air_only hint).
# Bind: Shift + RMB on TNT. Reset: Shift + RMB in the air only
# (Shift + RMB on any other block shows the shift_air_only hint).
[remote_detonator]
# Master switch (false = the item exists but reacts to nothing).
# Default: true
enabled = true
# Fuse of the TNT ignited by the detonator, ticks (80 = redstone-ignited TNT).
# Default: 80
fuse_ticks = 80
# Cooldown between two detonations of one player, milliseconds.
# Default: 1000
cooldown_ms = 1000
# Max distance to the bound block, blocks (0 = unlimited).
# Default: 0
max_distance = 0
# Allow detonating a charge bound in another world.
# Default: true
cross_world = true
# Item durability: one unit is spent per detonation, at zero the item breaks.
# Default: 128
max_uses = 128
# Sound played at the bound block on detonation (Bukkit Sound name).
# Default: ITEM_FLINTANDSTEEL_USE
ignite_sound = "ITEM_FLINTANDSTEEL_USE"
# Sound played to the player on bind / rebind (Bukkit Sound name).
# Default: BLOCK_NOTE_BLOCK_PLING
bind_sound = "BLOCK_NOTE_BLOCK_PLING"

# Portable Workbench — a crafting table in the pocket.
# One opening spends one charge; the last charge breaks the item.
[portable_workbench]
# Master switch (false = the item exists but reacts to nothing).
# Default: true
enabled = true
# Charges (one opening per charge). The item breaks when the last one is spent.
# Default: 64
max_charges = 64
# Cooldown between two openings of one player, milliseconds.
# Default: 250
cooldown_ms = 250
# Sound on opening (Bukkit Sound name, empty = silent).
# Default: BLOCK_WOOD_PLACE
open_sound = "BLOCK_WOOD_PLACE"
# Sound when the item breaks (Bukkit Sound name, empty = silent).
# Default: ENTITY_ITEM_BREAK
break_sound = "ENTITY_ITEM_BREAK"
# Particle on break (Bukkit Particle name, empty = none).
# Data-carrying particles (ITEM, BLOCK_ITEM) get the broken item as data.
# Default: ITEM
break_particle = "ITEM"
# Particles per break.
# Default: 16
break_particle_count = 16

# Fireball — vanilla Fire Charge shoots a fireball when used in the air.
[fireball]
# Master switch (true = right-click in air shoots, false = vanilla behaviour only).
# Default: true
enabled = true
# Log every Fire Charge air click (hand, item, cancellation, permission) to the console.
# Default: false
debug = false
# Usage also requires the ui.fireball.use permission (default: nobody).
# cooldown_ms — cooldown between shots of one player, milliseconds.
# Default: 1000
cooldown_ms = 1000
# Projectile speed in blocks per tick.
# Default: 1.5
speed = 1.5
# Explosion power (1..127; 1 = ghast fireball).
# Default: 1.0
explosion_power = 1.0
# Set hit entities / the ground on fire.
# Default: true
incendiary = true
# Allow the explosion to destroy blocks.
# Default: true
block_damage = true
# Allow the shooter to damage themselves with their own fireball.
# Default: false
self_damage = false
# Sound played on the shot (Bukkit Sound name, empty = silent).
# Default: ENTITY_GHAST_SHOOT
shoot_sound = "ENTITY_GHAST_SHOOT"

