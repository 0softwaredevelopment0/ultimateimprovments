name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Verify tag matches project version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE "s/^version = '([^']+)'/\\1/p" build.gradle | head -n1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle version '$VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test all modules
        run: ./gradlew --no-daemon clean build

      - name: Package all plugin JARs
        run: bash Scripts/build/package_jars.sh --no-build

      - name: Generate release changelog
        run: node Scripts/build/create_release_notes.js "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release and upload archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="build/distribution/UltimateImprovments-${VERSION}-jars.tar"
          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${PRERELEASE_ARGS[@]}"
